name = "oci-helper-serverless"
main = "dist/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 不改 database_id 的可选方案：本文件不声明 D1，部署后请在 Dashboard →
# 设置 → 绑定 里手动添加 D1 数据库，变量名填 DB（大小写一致）。
# 需先手动创建库；Worker 首次请求会自动建表。
# 用法：npx wrangler deploy --config wrangler.import.toml

[[durable_objects.bindings]]
name = "LOG_HUB"
class_name = "LogHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LogHub"]

[triggers]
crons = ["* * * * *"]
