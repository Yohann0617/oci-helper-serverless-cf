name = "oci-helper-serverless"
main = "dist/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 不声明 D1 的版本：部署后在 Dashboard → 设置 → 绑定 手动添加 D1（变量名 DB）。
# 用法：npx wrangler deploy --config wrangler.import.toml

[[durable_objects.bindings]]
name = "LOG_HUB"
class_name = "LogHub"

[[durable_objects.bindings]]
name = "VNC_TUNNEL"
class_name = "VncTunnel"

[exports.LogHub]
type = "durable-object"
storage = "sqlite"

[exports.VncTunnel]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["* * * * *"]
